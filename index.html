<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luisitomd.org</title>
    <link rel="stylesheet" href="css/style2.css">
    <link rel="shortcut icon" href="img/tc_ico.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body id="pag" style="background-color: black;">
    <div id="containerInicio" class="d-flex justify-content-center align-items-center" style="width: 100vw; height: 100vh;">
        <button id="btnLol" class="btn-secondary btn-lg px-5 py-3">Partir la bandeja (te manda pa la canción de Fortnite en youtube)</button>
    </div>

    <audio id="audio-screamer" loop autoplay src="snd/mariopaScreamer.ogg" preload="auto"></audio>

    <script>
        document.getElementById('btnLol').addEventListener('click', function() {
            document.getElementById('btnLol').style.display = "none";
            document.getElementById('pag').classList.add('animacionMariopa');
            document.getElementById('audio-screamer').play();
        });
    </script>
</body>
</html>
